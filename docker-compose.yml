services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noutes
      POSTGRES_USER: noutes
      POSTGRES_PASSWORD: noutes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noutes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/noutes
      JWT_SECRET: change-me-in-production-at-least-32-chars!!
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  collab:
    build:
      context: ./collab-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://noutes:noutes@postgres:5432/noutes
      API_URL: http://api:8080
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_COLLAB_URL: ws://localhost:3001
    depends_on:
      - api
      - collab

volumes:
  postgres_data: